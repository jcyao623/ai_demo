  server:
    port: 8081
 
  spring:
    application:
      name: ai-demo-service
 
    config:
      import:
        - optional:nacos:ai-demo-service.yml
 
    cloud:
      nacos:
        discovery:
          server-addr: 127.0.0.1:8848
        config:
          server-addr: 127.0.0.1:8848
 
    data:
      redis:
        host: localhost
        port: 6379
        timeout: 3000ms
        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 0
 
    ai:
      openai:
        api-key: placeholder
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        chat:
          options:
            model: qwen-plus
 
  logging:
    level:
      com.aidemo: DEBUG
 

